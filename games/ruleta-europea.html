<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e0c0a">
  <title>Ruleta Europea · Mesa KARMA · Casino NYC</title>
  <link rel="icon" href="../icons/casino-nyc.svg" type="image/svg+xml">
  <link rel="stylesheet" href="karma-mesa.m7.css">
</head>
<body>
  <div class="mesa-root" id="mesaRoot">
    <header class="mesa-bar">
      <a class="back-lobby" href="../index.html#juegos">‹ Lobby</a>
      <div class="mesa-brand">
        CASINO NYC
        <small>Mesa KARMA · Demo</small>
      </div>
      <div class="beads" id="beads" aria-label="Números anteriores"></div>
      <div class="mesa-credit">
        <span>Crédito</span>
        <strong id="creditValue">0.00</strong>
      </div>
      <div class="phase-pill" id="phasePill">Apuesta 0.00</div>
    </header>

    <div class="table-unit">
      <p class="table-jackpot"><span>Jackpot</span><strong id="jackpotValue">0.00</strong></p>
      <div class="table-surface">
        <img class="table-croupier" src="../assets/monkey-croupier-real.png" alt="" draggable="false">
        <section class="wheel-well">
          <div class="banner" id="noMoreBets" hidden>No más apuestas</div>
          <div class="plaque" id="plaque" hidden></div>
          <canvas id="karmaCanvas" class="wheel-canvas" role="img" aria-label="Rueda de ruleta europea animada"></canvas>
          <p class="demo-banner">Solo créditos ficticios · Sin POS ni dinero real</p>
        </section>
        <div class="felt-stage">
          <div class="felt-rail">
            <div class="felt-cloth" id="feltCloth"></div>
          </div>
        </div>
      </div>
    </div>

    <footer class="tray">
      <div class="tray-chips" id="trayChips"></div>
      <div class="tray-actions">
        <button type="button" class="ghost-btn" id="undoBtn">Deshacer</button>
        <button type="button" class="ghost-btn" id="clearBtn">Limpiar</button>
        <button type="button" class="ghost-btn" id="repeatBtn">Repetir</button>
        <span class="phase-pill" id="mesaNotice" aria-live="polite"></span>
      </div>
      <button type="button" class="spin-btn" id="spinBtn">Girar</button>
    </footer>
  </div>

  <script src="casino-core.js?v=m7"></script>
  <script src="vendor/three.min.js"></script>
  <script src="karma-wheel-3d.js?v=m7"></script>
  <script src="karma-wheel.js?v=m7"></script>
  <script src="karma-board.js?v=m7"></script>
  <script src="karma-mesa.js?v=m7"></script>
</body>
</html>
